name: Verify standalone memory service
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke:self
      - run: npm run package:solution
      - run: npm run verify:solution
      - name: Build the submitted root Dockerfile
        run: |
          unzip -q delivery-output/solution.zip -d delivery-output/extracted
          docker build -t memory-service:test delivery-output/extracted/solution
      - name: Cold start and HTTP contract smoke
        run: |
          docker run -d --name memory-delivery-test --init -p 127.0.0.1:8097:8088 memory-service:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8097/health; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs --url http://127.0.0.1:8097
      - name: Remove test container and its anonymous volume
        if: always()
        run: docker rm -fv memory-delivery-test || true
